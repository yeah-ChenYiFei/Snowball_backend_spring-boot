# ============================
# SnowBall 开发环境 —— 连接配置模板
# ============================
# 使用步骤：
#   1. 复制本文件 → application-dev.properties
#   2. 替换下面所有 【必须修改】 标注的值为你的实际配置
#   3. application-dev.properties 已被 .gitignore 忽略，不会提交
# ============================

# ── MySQL ──
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 【必须修改】数据库 IP 和端口
spring.datasource.url=jdbc:mysql://<数据库IP>:3306/snowball?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
# 【必须修改】数据库用户名
spring.datasource.username=<数据库用户名>
# 【必须修改】数据库密码
spring.datasource.password=<数据库密码>

# ── MinIO 对象存储 ──
# 【必须修改】MinIO 所在机器的局域网 IP
minio.endpoint=http://<本机IP>:9000
# 【必须修改】MinIO 访问密钥（默认 minioadmin，建议修改）
minio.access-key=<minio-access-key>
# 【必须修改】MinIO 秘密密钥（默认 minioadmin，建议修改）
minio.secret-key=<minio-secret-key>
# 【 不用改 】bucket 名称
minio.bucket=snowball
