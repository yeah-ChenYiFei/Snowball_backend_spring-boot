# ============================
# SnowBall 开发环境 —— 连接配置模板
# ============================
# 使用步骤：
#   1. 复制本文件 → application-dev.properties
#   2. 替换占位符为你的实际配置（或设置对应的环境变量）
#   3. application-dev.properties 已被 .gitignore 忽略，不会提交
#
# 所有配置项均支持环境变量覆盖，格式：${变量名:默认值}
# 本地开发不设环境变量时，直接修改冒号后面的默认值即可
# ============================

# ── MySQL ──
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://<数据库IP>:3306/snowball?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:<数据库用户名>}
spring.datasource.password=${DB_PASSWORD:<数据库密码>}

# ── MinIO 对象存储 ──
minio.endpoint=${MINIO_ENDPOINT:http://<MinIO_IP>:9000}
minio.access-key=${MINIO_ACCESS_KEY:<minio-access-key>}
minio.secret-key=${MINIO_SECRET_KEY:<minio-secret-key>}
minio.bucket=${MINIO_BUCKET:snowball}
