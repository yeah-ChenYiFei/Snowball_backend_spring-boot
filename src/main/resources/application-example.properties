# ============================
# SnowBall 公共配置模板
# 复制为 application.properties，修改标注项
# ============================

spring.application.name=SnowBall
# 【 二选一 】激活的环境：dev（开发）或 prod（生产）
spring.profiles.active=dev

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
# 【 可选 】开发时 true 查看 SQL，生产改 false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── HikariCP 连接池 ──
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ── JWT ──
# 【 必须修改 】生产环境请通过环境变量 JWT_SECRET 设置，至少 32 字符
jwt.secret=${JWT_SECRET:请替换为至少32字符的随机密钥}

# ── 日志 ──
logging.level.root=INFO
# 【 可选 】开发时 DEBUG 查看详细日志，生产改 INFO
logging.level.com.snowball=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── 邮件 (SMTP) ──
# 可通过环境变量覆盖：SMTP_HOST / SMTP_PORT / SMTP_USERNAME / SMTP_PASSWORD
spring.mail.host=${SMTP_HOST:smtp.qq.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:你的QQ邮箱}
spring.mail.password=${SMTP_PASSWORD:你的QQ邮箱授权码}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── 文件上传 ──
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp,bmp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Gzip 压缩 ──
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
